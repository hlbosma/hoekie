<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoekie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-firestore-compat.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-screen" id="setupScreen" style="display:none">
  <div class="auth-box">
    <div class="brand">Hoekie</div>
    <div class="setup-banner">No Firebase config found yet, so this copy will only save tasks in this one browser. Fill in <code>FIREBASE_CONFIG</code> near the top of the file's script to turn on cross-device sync.</div>
    <div class="sheet-actions"><button style="width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:var(--radius);padding:12px;font-weight:700;cursor:pointer;font-family:inherit" onclick="document.getElementById('setupScreen').style.display='none'; startApp();">Continue without sync</button></div>
  </div>
</div>

<div class="auth-screen" id="authScreen" style="display:none">
  <div class="auth-box">
    <div class="brand">Hoekie</div>
    <p>Sign in to sync your tasks across your devices.</p>
    <label>Email</label>
    <input type="text" id="auth-email" autocomplete="username">
    <label>Password</label>
    <input type="password" id="auth-password" autocomplete="current-password" placeholder="At least 6 characters">
    <div class="sheet-actions">
      <button id="authSignup" style="flex:1;background:none;border:1px solid var(--line);color:var(--ink-soft);border-radius:var(--radius);padding:12px;font-weight:700;cursor:pointer;font-family:inherit">Create account</button>
      <button id="authSignin" style="flex:1;background:var(--ink);color:var(--paper);border:none;border-radius:var(--radius);padding:12px;font-weight:700;cursor:pointer;font-family:inherit">Sign in</button>
    </div>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<header>
  <div class="brand">Hoekie</div>
  <nav>
    <button data-view="today" class="active">Today</button>
    <button data-view="later">Later</button>
    <button data-view="all">All tasks</button>
    <button data-view="quick">Quick</button>
    <button data-view="tags">Tags & Projects</button>
    <button data-view="archive">Archive</button>
    <div class="nav-right">
      <button class="icon-btn" id="exportBtn" title="Download all tasks as CSV">⬇ CSV</button>
      <button class="icon-btn" id="signOutBtn" style="display:none">Sign out</button>
    </div>
  </nav>
</header>
<main id="main"></main>
<button class="fab-quick" id="quickFab" title="Add a quick task">⚡</button>
<button class="fab" id="addBtn">+</button>

<div class="sheet-wrap" id="quickWrap">
  <div class="sheet" style="max-width:420px">
    <h2>Quick task</h2>
    <label>Title</label>
    <input type="text" id="q-title" placeholder="Just the task name for now...">
    <div class="sheet-actions">
      <button id="qCancel" style="flex:none;background:none;border:none;color:var(--ink-soft);font-weight:700;padding:11px 4px;cursor:pointer;font-family:inherit">Cancel</button>
      <button id="qSave" style="flex:1;background:var(--work);color:#fff;border:none;border-radius:var(--radius);padding:12px;font-weight:700;cursor:pointer;font-family:inherit">Add quick task</button>
    </div>
  </div>
</div>

<div class="sheet-wrap" id="sheetWrap">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 id="sheetTitle">New task</h2>
      <button class="plan-btn" id="cancelBtn" style="border:none">Cancel</button>
    </div>
    <div class="hint" id="stepProgress" style="margin:-8px 0 4px"></div>
    <div class="steps-left" id="stepsLeft"></div>

    <div class="step" data-step="1">
      <label>Title</label>
      <input type="text" id="f-title" placeholder="What needs doing?">
    </div>

    <div class="step" data-step="2">
      <label>Type</label>
      <div class="seg" id="f-type">
        <button data-v="personal" class="on">Personal</button>
        <button data-v="work">Work</button>
        <button data-v="someday">Someday</button>
      </div>
      <div id="f-projectWrap" style="display:none">
        <label>Project</label>
        <input type="text" id="f-project" placeholder="Type a new project, or pick one below" list="projList">
        <datalist id="projList"></datalist>
        <div class="chip-row" id="f-projectChips"></div>
      </div>
    </div>

    <div class="step" data-step="3">
      <label>Priority</label>
      <div class="seg" id="f-priority">
        <button data-v="high">ASAP</button>
        <button data-v="medium" class="on">Soon</button>
        <button data-v="low">Later</button>
      </div>
    </div>

    <div class="step" data-step="4">
      <div class="checkbox-row"><input type="checkbox" id="f-later"><label style="margin:0" for="f-later">I'll plan the date later</label></div>
      <div id="f-dateFields">
        <label>Planned date</label>
        <input type="date" id="f-planned">
        <div class="checkbox-row"><input type="checkbox" id="f-spans"><label style="margin:0" for="f-spans">This task spans multiple days</label></div>
        <div id="f-endWrap" style="display:none">
          <label>End date</label>
          <input type="date" id="f-enddate">
        </div>
      </div>
    </div>

    <div class="step" data-step="5">
      <label>Due date (optional)</label>
      <input type="date" id="f-due">
    </div>

    <div class="step" data-step="6">
      <label>Repeats</label>
      <div class="seg" id="f-recurFreq">
        <button data-v="none" class="on">Never</button>
        <button data-v="days">Every X days</button>
        <button data-v="weekly">Weekly</button>
        <button data-v="monthly">Monthly</button>
      </div>
      <div id="f-recurExtra" style="display:none">
        <div class="row2">
          <div><label id="f-intervalLabel">Every</label><input type="number" id="f-interval" min="1" value="1"></div>
          <div id="f-modeWrap">
            <label>Base next one on</label>
            <div class="seg" id="f-recurMode">
              <button data-v="completion" class="on">Completion date</button>
              <button data-v="fixed">Fixed schedule</button>
            </div>
          </div>
        </div>
        <div id="f-weekdayWrap" style="display:none">
          <label>Day of the week</label>
          <div class="seg" id="f-weekday">
            <button data-v="1">Mon</button><button data-v="2">Tue</button><button data-v="3">Wed</button>
            <button data-v="4">Thu</button><button data-v="5">Fri</button><button data-v="6">Sat</button><button data-v="0">Sun</button>
          </div>
        </div>
        <div id="f-monthdayWrap" style="display:none">
          <label>Day of the month</label>
          <input type="number" id="f-monthday" min="1" max="31" value="1">
        </div>
        <div class="hint" id="f-recurHint"></div>
      </div>
    </div>

    <div class="step" data-step="7">
      <label>Labels</label>
      <input type="text" id="f-labels" placeholder="Add new labels, comma-separated">
      <div class="chip-row" id="f-labelChips"></div>
    </div>

    <div class="sheet-actions">
      <button id="backBtn">Back</button>
      <button id="nextBtn">Next</button>
      <button id="saveBtn" style="display:none">Save task</button>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
