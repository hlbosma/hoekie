<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoekie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase: these three libraries give us user accounts (auth) and a cloud database (firestore) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-firestore-compat.min.js"></script>
<style>
/* ============ COLOR PALETTE ============
   Base colors (background/text/borders) are the original neutral cream
   theme. Hanne's 12-color palette is used ONLY as accent colors, on
   things like priority tags, type labels and badges - not as large
   background fills, since bright color everywhere was overwhelming. */
:root{
  --paper:#F6F3EC;      /* page background - restored neutral cream */
  --card:#FFFFFF;        /* surface behind cards, the sheet, etc. */
  --line:#DCD5C7;        /* borders / dividers */
  --ink:#22303A;         /* main text */
  --ink-soft:#5B6B72;    /* secondary text, muted borders */

  /* --- accent colors, from Hanne's palette, used only for small tags/badges --- */
  --personal:#849E15;    /* "Personal" task type */
  --work:#6777B6;        /* "Work" task type */
  --someday:#B28622;     /* "Someday" task type (the parking-lot type) */
  --pr-high:#D8560E;     /* "ASAP" priority */
  --pr-medium:#E1903E;   /* "Soon" priority */
  --pr-low:#CBD183;      /* "Later" priority */
  --accent:#D17089;      /* labels */
  --inprogress:#92A2A6;  /* "in progress" badge */
  --quick:#F8CABA;       /* "quick task" badge */
  /* Spare/unused from the given palette, in case you want them for
     something later: #D3C2CD, #EFCE7B, #2B2B23 */

  --radius:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Libre Franklin',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,.brand{font-family:'Space Grotesk',sans-serif;}

header{position:sticky;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--paper);border-bottom:1px solid var(--line);z-index:5;}
.brand{font-size:20px;font-weight:700;margin:0 0 10px;}
nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
nav button{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);padding:7px 12px;border-radius:20px;cursor:pointer;}
nav button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.nav-right{margin-left:auto;display:flex;gap:6px;}
.icon-btn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);padding:7px 10px;border-radius:20px;cursor:pointer;}

main{max-width:920px;margin:0 auto;padding:16px 16px 90px;}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.chip{font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);padding:5px 10px;border-radius:14px;cursor:pointer;}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.empty{color:var(--ink-soft);font-size:13px;padding:8px 0;text-align:center;opacity:.7;}

.priority-row{margin-bottom:20px;}
.priority-row-label{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;margin-bottom:10px;}
.priority-row-label .dot{width:10px;height:10px;border-radius:50%;flex:none;}
.type-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media (max-width:760px){ .type-columns{grid-template-columns:1fr;} }
.type-col-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}

.task{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;margin-bottom:8px;}
.task-top{display:flex;align-items:flex-start;gap:9px;}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-soft);flex:none;margin-top:1px;cursor:pointer;background:none;color:transparent;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
.check.done{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.task-title{font-weight:600;font-size:14px;flex:1;line-height:1.3;}
.task-title.done{text-decoration:line-through;color:var(--ink-soft);}
.edit-btn{background:none;border:none;color:var(--ink-soft);font-size:11px;font-weight:600;cursor:pointer;padding:2px 4px;text-decoration:underline;flex:none;}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;font-size:10px;}
.tag{padding:3px 7px;border-radius:8px;font-weight:700;background:var(--paper);border:1px solid var(--line);}
.tag.work{color:var(--work);}
.tag.pr-high{color:var(--pr-high);}
.tag.pr-medium{color:var(--pr-medium);}
.tag.pr-low{color:var(--pr-low);}
.tag.plain{color:var(--ink-soft);}
.tag.label{color:var(--accent);}
.tag.inprog{color:var(--inprogress);}
.tag.quick{color:var(--quick);}
.task-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.plan-btn{font-size:11px;font-weight:600;background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);padding:4px 9px;border-radius:8px;cursor:pointer;}
.plan-btn.active{border-color:var(--inprogress);color:var(--inprogress);}
.finish-btn{font-size:11px;font-weight:600;background:var(--ink);color:var(--paper);border:none;padding:6px 12px;border-radius:8px;cursor:pointer;}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:26px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.fab-quick{position:fixed;right:22px;bottom:calc(82px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;background:var(--work);color:#fff;font-size:17px;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);}

.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:20;}
.sheet-wrap.open{display:flex;}
.sheet{background:var(--card);width:100%;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));}
.sheet h2{margin:0 0 14px;font-size:18px;}
.step{display:none;}
.step.active{display:block;}
@media (min-width: 700px){
  .sheet-wrap{align-items:stretch;justify-content:flex-end;}
  .sheet{width:400px;max-width:90vw;height:100%;max-height:100vh;border-radius:16px 0 0 16px;}
}
label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:12px 0 5px;}
input[type=text],input[type=date],input[type=number],input[type=password]{width:100%;font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);}
.row2{display:flex;gap:10px;}
.row2>*{flex:1;}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button{flex:1;min-width:64px;font:inherit;font-size:13px;font-weight:600;padding:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);border-radius:8px;cursor:pointer;}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink-soft);}
.checkbox-row input{width:16px;height:16px;}
/* Back/Next/Save are styled very differently from each other and from the
   option buttons above, on purpose, so they're never confused for options:
   Back = plain text link, Next = filled pill in the "work" accent color,
   Save = filled pill in dark ink. */
.sheet-actions{display:flex;align-items:center;gap:10px;margin-top:18px;}
#backBtn{flex:none;background:none;border:none;color:var(--ink-soft);font-weight:700;font-size:14px;padding:11px 4px;cursor:pointer;}
#nextBtn{flex:1;background:var(--work);color:#fff;border:none;border-radius:24px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;}
#saveBtn{flex:1;background:var(--ink);color:var(--paper);border:none;border-radius:24px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.pick-chip{font-size:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);padding:4px 9px;border-radius:12px;cursor:pointer;}
.pick-chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.hint{font-size:11px;color:var(--ink-soft);margin-top:6px;}

.auth-screen{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-box{width:100%;max-width:340px;}
.auth-box .brand{font-size:24px;margin-bottom:4px;}
.auth-box p{color:var(--ink-soft);font-size:13px;margin:0 0 18px;}
.auth-error{color:var(--pr-high);font-size:12px;margin-top:8px;min-height:14px;}
.setup-banner{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:14px;}
.setup-banner code{background:rgba(0,0,0,.06);padding:1px 4px;border-radius:4px;}

.archive-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 13px;margin-bottom:8px;}
.archive-row .info{flex:1;min-width:0;}
.archive-row .title{font-weight:600;font-size:14px;text-decoration:line-through;color:var(--ink-soft);}
.archive-row .date{font-size:11px;color:var(--ink-soft);}
.del-btn{font:inherit;font-size:12px;font-weight:700;background:none;border:1px solid var(--pr-high);color:var(--pr-high);padding:5px 10px;border-radius:8px;cursor:pointer;flex:none;}
</style>
</head>
<body>

<div class="auth-screen" id="setupScreen" style="display:none">
  <div class="auth-box">
    <div class="brand">Hoekie</div>
    <div class="setup-banner">No Firebase config found yet, so this copy will only save tasks in this one browser. Fill in <code>FIREBASE_CONFIG</code> near the top of the file's script to turn on cross-device sync.</div>
    <div class="sheet-actions"><button id="saveBtn2" class="btn-save" style="width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:24px;padding:12px;font-weight:700;cursor:pointer" onclick="document.getElementById('setupScreen').style.display='none'; startApp();">Continue without sync</button></div>
  </div>
</div>

<div class="auth-screen" id="authScreen" style="display:none">
  <div class="auth-box">
    <div class="brand">Hoekie</div>
    <p>Sign in to sync your tasks across your devices.</p>
    <label>Email</label>
    <input type="text" id="auth-email" autocomplete="username">
    <label>Password</label>
    <input type="password" id="auth-password" autocomplete="current-password" placeholder="At least 6 characters">
    <div class="sheet-actions">
      <button id="authSignup" style="flex:1;background:none;border:1px solid var(--line);color:var(--ink-soft);border-radius:24px;padding:12px;font-weight:700;cursor:pointer">Create account</button>
      <button id="authSignin" style="flex:1;background:var(--ink);color:var(--paper);border:none;border-radius:24px;padding:12px;font-weight:700;cursor:pointer">Sign in</button>
    </div>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<header>
  <div class="brand">Hoekie</div>
  <nav>
    <button data-view="today" class="active">Today</button>
    <button data-view="later">Later</button>
    <button data-view="all">All tasks</button>
    <button data-view="quick">Quick</button>
    <button data-view="archive">Archive</button>
    <div class="nav-right">
      <button class="icon-btn" id="exportBtn" title="Download all tasks as CSV">⬇ CSV</button>
      <button class="icon-btn" id="signOutBtn" style="display:none">Sign out</button>
    </div>
  </nav>
</header>
<main id="main"></main>
<button class="fab-quick" id="quickFab" title="Add a quick task">⚡</button>
<button class="fab" id="addBtn">+</button>

<!-- Minimal quick-add: just a title, nothing else -->
<div class="sheet-wrap" id="quickWrap">
  <div class="sheet" style="max-width:420px">
    <h2>Quick task</h2>
    <label>Title</label>
    <input type="text" id="q-title" placeholder="Just the task name for now...">
    <div class="sheet-actions">
      <button id="qCancel" style="flex:none;background:none;border:none;color:var(--ink-soft);font-weight:700;padding:11px 4px;cursor:pointer">Cancel</button>
      <button id="qSave" style="flex:1;background:var(--work);color:#fff;border:none;border-radius:24px;padding:12px;font-weight:700;cursor:pointer">Add quick task</button>
    </div>
  </div>
</div>

<!-- The full add/edit task form: a step-by-step wizard, one field group at a time. -->
<div class="sheet-wrap" id="sheetWrap">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 id="sheetTitle">New task</h2>
      <button class="edit-btn" id="cancelBtn">Cancel</button>
    </div>
    <div class="hint" id="stepProgress" style="margin:-8px 0 10px"></div>

    <div class="step" data-step="1">
      <label>Title</label>
      <input type="text" id="f-title" placeholder="What needs doing?">
    </div>

    <div class="step" data-step="2">
      <label>Type</label>
      <div class="seg" id="f-type">
        <button data-v="personal" class="on">Personal</button>
        <button data-v="work">Work</button>
        <button data-v="someday">Someday</button>
      </div>
      <div id="f-projectWrap" style="display:none">
        <label>Project</label>
        <input type="text" id="f-project" placeholder="Type a new project, or pick one below" list="projList">
        <datalist id="projList"></datalist>
        <div class="chip-row" id="f-projectChips"></div>
      </div>
    </div>

    <div class="step" data-step="3">
      <label>Priority</label>
      <div class="seg" id="f-priority">
        <button data-v="high">ASAP</button>
        <button data-v="medium" class="on">Soon</button>
        <button data-v="low">Later</button>
      </div>
    </div>

    <!-- Dates: a planned date is optional; if set, it can optionally span
         multiple days by adding an end date. No more separate "single vs
         multi-day" task type - it's just whether an end date exists. -->
    <div class="step" data-step="4">
      <div class="checkbox-row"><input type="checkbox" id="f-later"><label style="margin:0" for="f-later">I'll plan the date later</label></div>
      <div id="f-dateFields">
        <label>Planned date</label>
        <input type="date" id="f-planned">
        <div class="checkbox-row"><input type="checkbox" id="f-spans"><label style="margin:0" for="f-spans">This task spans multiple days</label></div>
        <div id="f-endWrap" style="display:none">
          <label>End date</label>
          <input type="date" id="f-enddate">
        </div>
      </div>
    </div>

    <div class="step" data-step="5">
      <label>Due date (optional)</label>
      <input type="date" id="f-due">
    </div>

    <div class="step" data-step="6">
      <label>Repeats</label>
      <div class="seg" id="f-recurFreq">
        <button data-v="none" class="on">Never</button>
        <button data-v="days">Every X days</button>
        <button data-v="weekly">Weekly</button>
        <button data-v="monthly">Monthly</button>
      </div>
      <div id="f-recurExtra" style="display:none">
        <div class="row2">
          <div><label id="f-intervalLabel">Every</label><input type="number" id="f-interval" min="1" value="1"></div>
          <div id="f-modeWrap">
            <label>Base next one on</label>
            <div class="seg" id="f-recurMode">
              <button data-v="completion" class="on">Completion date</button>
              <button data-v="fixed">Fixed schedule</button>
            </div>
          </div>
        </div>
        <div id="f-weekdayWrap" style="display:none">
          <label>Day of the week</label>
          <div class="seg" id="f-weekday">
            <button data-v="1">Mon</button><button data-v="2">Tue</button><button data-v="3">Wed</button>
            <button data-v="4">Thu</button><button data-v="5">Fri</button><button data-v="6">Sat</button><button data-v="0">Sun</button>
          </div>
        </div>
        <div id="f-monthdayWrap" style="display:none">
          <label>Day of the month</label>
          <input type="number" id="f-monthday" min="1" max="31" value="1">
        </div>
        <div class="hint" id="f-recurHint"></div>
      </div>
    </div>

    <div class="step" data-step="7">
      <label>Labels</label>
      <input type="text" id="f-labels" placeholder="Add new labels, comma-separated">
      <div class="chip-row" id="f-labelChips"></div>
    </div>

    <div class="sheet-actions">
      <button id="backBtn">Back</button>
      <button id="nextBtn">Next</button>
      <button id="saveBtn" style="display:none">Save task</button>
    </div>
  </div>
</div>

<script>
/* ================================================================
   CONFIGURATION
   ================================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCWzS-HgJsaAUhYcX3shL1q3nepgUbtp1s",
  authDomain: "hoekie-303db.firebaseapp.com",
  projectId: "hoekie-303db",
};
const firebaseConfigured = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'YOUR_API_KEY';

/* ================================================================
   GLOBAL STATE
   ================================================================ */
let tasks = [];
let editingId = null;
let selectedLabels = new Set();
let fsDoc = null;
let unsub = null;
let applyingRemote = false;
let view = 'today';
let skipOpenId = null; // id of the task currently showing its inline "skip to date" picker

const filters = { project:null, label:null, showDone:false };

const PRIORITY_LABELS = { high:'ASAP', medium:'Soon', low:'Later' };
const PRIORITY_ORDER = ['high','medium','low'];
const TYPE_ORDER = ['personal','work','someday'];
const TYPE_LABELS = { personal:'Personal', work:'Work', someday:'Someday' };

/* ================================================================
   DATE HELPERS
   ================================================================ */
const todayStr = () => new Date().toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,10);
function addDays(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function addMonths(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

/* ================================================================
   DATA MIGRATION
   Older versions of this file stored multi-day tasks differently
   (a "kind" of single/multi, plus separate start/end fields and a
   day-by-day checklist). This converts any old-format task to the
   current shape (planned + optional endDate) the first time it's
   loaded, so nothing gets lost when this file is updated.
   ================================================================ */
function migrateTask(t){
  if(t.kind==='multi'){ t.planned = t.start || t.planned || null; t.endDate = t.end || null; }
  else if(t.endDate===undefined){ t.endDate = null; }
  if(t.inProgress===undefined) t.inProgress = false;
  if(t.quick===undefined) t.quick = false;
  delete t.kind; delete t.start; delete t.end; delete t.loggedDays;
  return t;
}

/* ================================================================
   LOADING & SAVING
   ================================================================ */
function loadLocal(){ try{ return JSON.parse(localStorage.getItem('vooruit_tasks')||'[]').map(migrateTask); }catch(e){ return []; } }
function persist(){
  localStorage.setItem('vooruit_tasks', JSON.stringify(tasks));
  if(fsDoc && !applyingRemote){ fsDoc.set({tasks}).catch(()=>{}); }
}
function cleanupOldArchive(){
  const cutoff = addDays(todayStr(), -30);
  const before = tasks.length;
  // Only tasks that are BOTH done AND completed more than 30 days ago are removed.
  // Anything not done, or done more recently, is always kept.
  tasks = tasks.filter(t => !(t.done && t.completedAt && t.completedAt < cutoff));
  if(tasks.length !== before) persist();
}
function startApp(){
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('signOutBtn').style.display = firebaseConfigured ? 'inline-block' : 'none';
  cleanupOldArchive();
  render();
}
function watchTasks(userUid){
  fsDoc = firebase.firestore().collection('users').doc(userUid).collection('planner').doc('tasks');
  unsub = fsDoc.onSnapshot(snap=>{
    applyingRemote = true;
    tasks = ((snap.exists && snap.data().tasks) || []).map(migrateTask);
    localStorage.setItem('vooruit_tasks', JSON.stringify(tasks));
    applyingRemote = false;
    cleanupOldArchive();
    render();
  });
  startApp();
}
function authErr(msg){ document.getElementById('authError').textContent = msg; }
function initApp(){
  if(!firebaseConfigured){
    tasks = loadLocal();
    document.getElementById('setupScreen').style.display = 'flex';
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().onAuthStateChanged(user=>{
    if(user){ watchTasks(user.uid); }
    else { if(unsub){ unsub(); unsub=null; } document.getElementById('authScreen').style.display='flex'; }
  });
  document.getElementById('authSignin').onclick = ()=>{
    const email=document.getElementById('auth-email').value.trim(), pw=document.getElementById('auth-password').value;
    authErr(''); firebase.auth().signInWithEmailAndPassword(email, pw).catch(e=>authErr(e.message));
  };
  document.getElementById('authSignup').onclick = ()=>{
    const email=document.getElementById('auth-email').value.trim(), pw=document.getElementById('auth-password').value;
    authErr(''); firebase.auth().createUserWithEmailAndPassword(email, pw).catch(e=>authErr(e.message));
  };
  document.getElementById('signOutBtn').onclick = ()=> firebase.auth().signOut();
}

/* ================================================================
   RECURRENCE MATH (unchanged logic, just no more kind/start/end)
   ================================================================ */
function stepDate(dateStr, freq, interval){
  if(freq==='days') return addDays(dateStr, interval);
  if(freq==='weekly') return addDays(dateStr, interval*7);
  if(freq==='monthly') return addMonths(dateStr, interval);
  return dateStr;
}
function nextWeekday(afterDate, weekday){
  let d = addDays(afterDate,1);
  while(new Date(d+'T00:00:00').getDay()!==weekday) d = addDays(d,1);
  return d;
}
function nextMonthDay(afterDate, monthDay){
  let d = addDays(afterDate,1);
  for(let i=0;i<62;i++){
    const dt = new Date(d+'T00:00:00');
    const dim = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate();
    if(dt.getDate() === Math.min(monthDay, dim)) return d;
    d = addDays(d,1);
  }
  return afterDate;
}
function nextOccurrenceRef(completedAt, recur){
  if(recur.mode==='fixed'){
    if(recur.freq==='weekly'){ let d=nextWeekday(completedAt, recur.weekday); if(recur.interval>1) d=addDays(d,(recur.interval-1)*7); return d; }
    if(recur.freq==='monthly'){ let d=nextMonthDay(completedAt, recur.monthDay); if(recur.interval>1) d=addMonths(d, recur.interval-1); return d; }
  }
  return stepDate(completedAt, recur.freq, recur.interval);
}

/* ================================================================
   TASK LOGIC
   ================================================================ */
// A task counts as "due today" if today falls anywhere between its
// planned date and its end date (the same date, if there's no end date).
function isDueTodayOrRange(t){
  if(!t.planned) return false;
  const end = t.endDate || t.planned;
  return t.planned<=todayStr() && todayStr()<=end;
}
function isUnscheduled(t){ return !t.planned; }

function completeTask(t){
  t.done = true; t.completedAt = todayStr(); t.inProgress = false;
  if(t.recur && t.recur.freq!=='none'){
    const newRef = nextOccurrenceRef(t.completedAt, t.recur);
    const nt = JSON.parse(JSON.stringify(t));
    nt.id = uid(); nt.done=false; nt.completedAt=null; nt.inProgress=false;
    const span = t.endDate ? daysBetween(t.planned, t.endDate) : 0;
    nt.planned = newRef;
    nt.endDate = span>0 ? addDays(newRef, span) : null;
    if(t.due){
      if(t.planned){ const offset = daysBetween(t.planned, t.due); nt.due = addDays(newRef, offset); }
      else { nt.due = stepDate(t.due, t.recur.freq, t.recur.interval); }
    }
    tasks.push(nt);
  }
  persist(); render();
}
// Moves a task's planned date to a new date without completing it,
// keeping the same span length if it had an end date.
function skipTask(t, newDate){
  const span = t.endDate ? daysBetween(t.planned, t.endDate) : 0;
  t.planned = newDate;
  t.endDate = span>0 ? addDays(newDate, span) : null;
  persist(); render();
}
function projectList(){ return [...new Set(tasks.filter(t=>t.type==='work' && t.project).map(t=>t.project))]; }
function labelList(){ const s=new Set(); tasks.forEach(t=>(t.labels||[]).forEach(l=>s.add(l))); return [...s]; }

function passesFilters(t){
  if(filters.project && t.project!==filters.project) return false;
  if(filters.label && !(t.labels||[]).includes(filters.label)) return false;
  if(t.done && !filters.showDone && t.completedAt!==todayStr()) return false;
  return true;
}
function recurLabel(t){
  if(!t.recur || t.recur.freq==='none') return '';
  const n = t.recur.interval>1 ? t.recur.interval+' ' : '';
  const unit = {days:'day(s)', weekly:'week(s)', monthly:'month(s)'}[t.recur.freq];
  let extra = '';
  if(t.recur.freq!=='days'){
    extra = t.recur.mode==='fixed' ? ' · fixed' : ' · from completion';
    if(t.recur.mode==='fixed'){
      if(t.recur.freq==='weekly') extra += ' ('+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][t.recur.weekday]+')';
      if(t.recur.freq==='monthly') extra += ' (day '+t.recur.monthDay+')';
    }
  }
  return `↻ every ${n}${unit}${extra}`;
}

/* ================================================================
   RENDERING
   ================================================================ */
function taskCard(t){
  const div = document.createElement('div'); div.className='task';
  const top = document.createElement('div'); top.className='task-top';

  const check = document.createElement('button');
  check.className = 'check'+(t.done?' done':'');
  check.textContent = t.done ? '✓' : '';
  check.onclick = ()=>{ if(t.done){ t.done=false; t.completedAt=null; persist(); render(); } else { completeTask(t); } };

  const title = document.createElement('div'); title.className='task-title'+(t.done?' done':'');
  title.textContent = t.title;

  const editBtn = document.createElement('button'); editBtn.className='edit-btn'; editBtn.textContent='Edit';
  editBtn.onclick = ()=>openSheet(t);

  top.append(check, title, editBtn);
  div.append(top);

  const meta = document.createElement('div'); meta.className='meta';
  meta.innerHTML =
    (t.type==='work' && t.project ? `<span class="tag work">${t.project}</span>` : '') +
    (t.due?`<span class="tag plain">Due ${t.due}</span>`:'')+
    (t.planned ? `<span class="tag plain">${t.endDate?(t.planned+' → '+t.endDate):('Planned '+t.planned)}</span>` : `<span class="tag plain">Not scheduled</span>`)+
    (recurLabel(t)?`<span class="tag plain">${recurLabel(t)}</span>`:'')+
    (t.inProgress?`<span class="tag inprog">In progress</span>`:'')+
    (t.quick?`<span class="tag quick">Quick</span>`:'')+
    (t.labels||[]).map(l=>`<span class="tag label">#${l}</span>`).join('');
  div.append(meta);

  if(!t.done){
    const actions = document.createElement('div'); actions.className='task-actions';
    const prog = document.createElement('button'); prog.className='plan-btn'+(t.inProgress?' active':'');
    prog.textContent = t.inProgress ? '● In progress' : 'Mark in progress';
    prog.onclick = ()=>{ t.inProgress = !t.inProgress; persist(); render(); };
    const skipBtn = document.createElement('button'); skipBtn.className='plan-btn';
    skipBtn.textContent = t.planned ? 'Skip to…' : 'Set date';
    skipBtn.onclick = ()=>{ skipOpenId = (skipOpenId===t.id)?null:t.id; render(); };
    actions.append(prog, skipBtn);
    div.append(actions);

    if(skipOpenId===t.id){
      const row = document.createElement('div'); row.className='row2'; row.style.marginTop='7px';
      const inp = document.createElement('input'); inp.type='date'; inp.value = t.planned || todayStr();
      const go = document.createElement('button'); go.className='finish-btn'; go.textContent='Move';
      go.onclick = ()=>{ skipTask(t, inp.value); skipOpenId=null; };
      row.append(inp, go);
      div.append(row);
    }
  }
  return div;
}

function renderFilterChips(container){
  const mk=(label,active,onClick)=>{const c=document.createElement('button');c.className='chip'+(active?' on':'');c.textContent=label;c.onclick=onClick;return c;};
  projectList().forEach(p=>container.append(mk(p, filters.project===p, ()=>{filters.project=filters.project===p?null:p; render();})));
  labelList().forEach(l=>container.append(mk('#'+l, filters.label===l, ()=>{filters.label=filters.label===l?null:l; render();})));
  container.append(mk(filters.showDone?'Hide done':'Show done', filters.showDone, ()=>{filters.showDone=!filters.showDone; render();}));
}
function renderBoard(main, list){
  PRIORITY_ORDER.forEach(pr=>{
    const row = document.createElement('div'); row.className='priority-row';
    const label = document.createElement('div'); label.className='priority-row-label';
    label.innerHTML = `<span class="dot" style="background:var(--pr-${pr})"></span> ${PRIORITY_LABELS[pr]}`;
    row.append(label);
    const cols = document.createElement('div'); cols.className='type-columns';
    TYPE_ORDER.forEach(ty=>{
      const col = document.createElement('div'); col.className='type-col';
      const colLabel = document.createElement('div'); colLabel.className='type-col-label';
      colLabel.style.color = `var(--${ty})`;
      colLabel.textContent = TYPE_LABELS[ty];
      col.append(colLabel);
      const cellTasks = list.filter(t=>t.priority===pr && t.type===ty);
      if(cellTasks.length===0){ const e=document.createElement('div'); e.className='empty'; e.textContent='—'; col.append(e); }
      else { cellTasks.forEach(t=>col.append(taskCard(t))); }
      cols.append(col);
    });
    row.append(cols);
    main.append(row);
  });
}
// Flat list of quick tasks (not yet fleshed out with full details).
function renderQuick(main){
  const list = tasks.filter(t=>t.quick && !t.done);
  if(list.length===0){ const e=document.createElement('div'); e.className='empty'; e.textContent='No quick tasks waiting - nice and tidy!'; main.append(e); return; }
  const note = document.createElement('div'); note.className='hint'; note.style.marginBottom='10px';
  note.textContent = "These were jotted down quickly. Tap Edit to fill in the rest and turn one into a normal task.";
  main.append(note);
  list.forEach(t=>main.append(taskCard(t)));
}
function renderArchive(main){
  const done = tasks.filter(t=>t.done).sort((a,b)=> (b.completedAt||'').localeCompare(a.completedAt||''));
  if(done.length===0){ const e=document.createElement('div'); e.className='empty'; e.textContent='Nothing archived yet.'; main.append(e); return; }
  const delAll = document.createElement('button'); delAll.className='del-btn'; delAll.style.marginBottom='12px';
  delAll.textContent = 'Delete all archived tasks';
  delAll.onclick = ()=>{
    if(confirm('Permanently delete all '+done.length+' finished tasks? Unfinished tasks are never affected by this.')){
      tasks = tasks.filter(t=>!t.done);
      persist(); render();
    }
  };
  main.append(delAll);
  const note = document.createElement('div'); note.className='hint'; note.style.marginBottom='10px';
  note.textContent = 'Finished tasks are removed automatically 30 days after completion.';
  main.append(note);
  done.forEach(t=>{
    const row = document.createElement('div'); row.className='archive-row';
    const info = document.createElement('div'); info.className='info';
    info.innerHTML = `<div class="title">${t.title}</div><div class="date">Finished ${t.completedAt}</div>`;
    const del = document.createElement('button'); del.className='del-btn'; del.textContent='Delete';
    del.onclick = ()=>{
      if(confirm('Delete "'+t.title+'" permanently?')){ tasks = tasks.filter(x=>x.id!==t.id); persist(); render(); }
    };
    row.append(info, del);
    main.append(row);
  });
}
function render(){
  document.querySelectorAll('nav button[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  const main = document.getElementById('main'); main.innerHTML='';
  if(view==='archive'){ renderArchive(main); return; }
  if(view==='quick'){ renderQuick(main); return; }

  const chipsWrap = document.createElement('div'); chipsWrap.className='filters';
  renderFilterChips(chipsWrap);
  main.append(chipsWrap);

  // Quick tasks stay out of the main board until they've been given full details.
  let list = tasks.filter(t=>!t.quick).filter(passesFilters);
  if(view==='today') list = list.filter(isDueTodayOrRange);
  if(view==='later') list = list.filter(t=>isUnscheduled(t) && (!t.done || t.completedAt===todayStr()));

  if(list.length===0){
    const e=document.createElement('div'); e.className='empty';
    e.textContent = view==='today' ? 'Nothing planned for today.' : view==='later' ? 'No unscheduled tasks.' : 'No tasks match these filters.';
    main.append(e);
  } else { renderBoard(main, list); }
}
document.querySelectorAll('nav button[data-view]').forEach(b=>b.onclick=()=>{ view=b.dataset.view; render(); });

/* ================================================================
   CSV EXPORT
   ================================================================ */
function csvEscape(v){ v=(v===null||v===undefined)?'':String(v); return '"'+v.replace(/"/g,'""')+'"'; }
document.getElementById('exportBtn').onclick = ()=>{
  const cols = ['title','type','project','priority','planned','endDate','due','recur_summary','labels','inProgress','quick','done','completedAt'];
  const rows = [cols.join(',')];
  tasks.forEach(t=>{
    rows.push([
      csvEscape(t.title), csvEscape(t.type), csvEscape(t.project),
      csvEscape(PRIORITY_LABELS[t.priority]), csvEscape(t.planned), csvEscape(t.endDate), csvEscape(t.due),
      csvEscape(recurLabel(t)), csvEscape((t.labels||[]).join('; ')),
      csvEscape(t.inProgress), csvEscape(t.quick), csvEscape(t.done), csvEscape(t.completedAt)
    ].join(','));
  });
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='hoekie-tasks-'+todayStr()+'.csv';
  document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url);
};

/* ================================================================
   QUICK-ADD (title only)
   ================================================================ */
const quickWrap = document.getElementById('quickWrap');
document.getElementById('quickFab').onclick = ()=>{ document.getElementById('q-title').value=''; quickWrap.classList.add('open'); };
document.getElementById('qCancel').onclick = ()=> quickWrap.classList.remove('open');
quickWrap.onclick = (e)=>{ if(e.target.id==='quickWrap') quickWrap.classList.remove('open'); };
document.getElementById('qSave').onclick = ()=>{
  const title = document.getElementById('q-title').value.trim();
  if(!title) return;
  tasks.push({
    id: uid(), title, type:'personal', project:null, priority:'medium',
    planned:null, endDate:null, due:null,
    recur:{freq:'none', interval:1, mode:'completion', weekday:0, monthDay:1},
    labels:[], done:false, completedAt:null, inProgress:false, quick:true
  });
  persist();
  quickWrap.classList.remove('open');
  view = 'quick';
  render();
};

/* ================================================================
   THE FULL ADD/EDIT FORM (step-by-step wizard)
   ================================================================ */
const sheetWrap = document.getElementById('sheetWrap');
function seg(id,val){ document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on', b.dataset.v===val)); }
function segVal(id){ return document.querySelector('#'+id+' button.on').dataset.v; }

document.querySelectorAll('.seg').forEach(s=>{
  s.addEventListener('click', e=>{
    if(e.target.tagName!=='BUTTON') return;
    seg(s.id, e.target.dataset.v);
    if(s.id==='f-type'){
      document.getElementById('f-projectWrap').style.display = e.target.dataset.v==='work'?'block':'none';
      if(e.target.dataset.v==='work') renderProjectChips();
    }
    if(s.id==='f-recurFreq' || s.id==='f-recurMode' || s.id==='f-weekday') updateRecurVisibility();
  });
});
document.getElementById('f-later').addEventListener('change', updateDateFieldsVisibility);
document.getElementById('f-spans').addEventListener('change', updateDateFieldsVisibility);
document.getElementById('f-monthday').addEventListener('input', updateRecurVisibility);

function updateDateFieldsVisibility(){
  const later = document.getElementById('f-later').checked;
  document.getElementById('f-dateFields').style.display = later ? 'none' : 'block';
  document.getElementById('f-endWrap').style.display = (!later && document.getElementById('f-spans').checked) ? 'block' : 'none';
}
function updateRecurVisibility(){
  const freq = segVal('f-recurFreq'), mode = segVal('f-recurMode');
  const extra = document.getElementById('f-recurExtra');
  extra.style.display = freq==='none' ? 'none':'block';
  document.getElementById('f-modeWrap').style.display = freq==='days' ? 'none':'block';
  document.getElementById('f-weekdayWrap').style.display = (freq==='weekly' && mode==='fixed') ? 'block':'none';
  document.getElementById('f-monthdayWrap').style.display = (freq==='monthly' && mode==='fixed') ? 'block':'none';
  const labels = {days:'Every (days)', weekly:'Every (weeks)', monthly:'Every (months)'};
  document.getElementById('f-intervalLabel').textContent = labels[freq] || 'Every';
  const hint = document.getElementById('f-recurHint');
  if(freq==='none') hint.textContent='';
  else if(freq==='days') hint.textContent='Next task is created N days after you finish this one.';
  else if(mode==='fixed') hint.textContent='Always lands on the day you pick below, no matter when you finish it.';
  else hint.textContent='Counts forward from the day you actually finish the task.';
}
function renderProjectChips(){
  const wrap = document.getElementById('f-projectChips'); wrap.innerHTML='';
  projectList().forEach(p=>{
    const c = document.createElement('button'); c.type='button';
    c.className='pick-chip'+(document.getElementById('f-project').value===p?' on':'');
    c.textContent = p;
    c.onclick = ()=>{ document.getElementById('f-project').value = p; renderProjectChips(); };
    wrap.append(c);
  });
}
function renderLabelChips(){
  const wrap = document.getElementById('f-labelChips'); wrap.innerHTML='';
  labelList().forEach(l=>{
    const c = document.createElement('button'); c.type='button'; c.className='pick-chip'+(selectedLabels.has(l)?' on':'');
    c.textContent = '#'+l;
    c.onclick = ()=>{ selectedLabels.has(l)?selectedLabels.delete(l):selectedLabels.add(l); renderLabelChips(); };
    wrap.append(c);
  });
}

const TOTAL_STEPS = 7;
let currentStep = 1;
function showStep(n){
  currentStep = n;
  document.querySelectorAll('.step').forEach(s=>s.classList.toggle('active', parseInt(s.dataset.step)===n));
  document.getElementById('stepProgress').textContent = 'Step '+n+' of '+TOTAL_STEPS;
  document.getElementById('backBtn').style.display = n===1 ? 'none':'inline-block';
  document.getElementById('nextBtn').style.display = n===TOTAL_STEPS ? 'none':'block';
  document.getElementById('saveBtn').style.display = n===TOTAL_STEPS ? 'block':'none';
}
document.getElementById('nextBtn').onclick = ()=>{
  if(currentStep===1 && !document.getElementById('f-title').value.trim()){ document.getElementById('f-title').focus(); return; }
  if(currentStep<TOTAL_STEPS) showStep(currentStep+1);
};
document.getElementById('backBtn').onclick = ()=>{ if(currentStep>1) showStep(currentStep-1); };
document.getElementById('cancelBtn').onclick = ()=> sheetWrap.classList.remove('open');
sheetWrap.onclick = (e)=>{ if(e.target.id==='sheetWrap') sheetWrap.classList.remove('open'); };

function openSheet(task){
  showStep(1);
  editingId = task ? task.id : null;
  document.getElementById('sheetTitle').textContent = task ? 'Edit task' : 'New task';
  document.getElementById('f-title').value = task ? task.title : '';
  seg('f-type', task ? task.type : 'personal');
  document.getElementById('f-projectWrap').style.display = (task?task.type:'personal')==='work' ? 'block':'none';
  document.getElementById('f-project').value = task && task.project ? task.project : '';
  seg('f-priority', task ? task.priority : 'medium');

  document.getElementById('f-later').checked = task ? isUnscheduled(task) : true;
  document.getElementById('f-planned').value = task && task.planned ? task.planned : (task?'':todayStr());
  document.getElementById('f-spans').checked = !!(task && task.endDate);
  document.getElementById('f-enddate').value = task && task.endDate ? task.endDate : (task?'':todayStr());
  updateDateFieldsVisibility();

  document.getElementById('f-due').value = task && task.due ? task.due : '';

  const now = new Date();
  const recur = task && task.recur ? task.recur : {freq:'none', interval:1, mode:'completion', weekday:now.getDay(), monthDay:now.getDate()};
  seg('f-recurFreq', recur.freq);
  document.getElementById('f-interval').value = recur.interval || 1;
  seg('f-recurMode', recur.mode || 'completion');
  seg('f-weekday', String(recur.weekday!==undefined ? recur.weekday : now.getDay()));
  document.getElementById('f-monthday').value = recur.monthDay || now.getDate();
  updateRecurVisibility();

  document.getElementById('f-labels').value='';
  selectedLabels = new Set(task && task.labels ? task.labels : []);
  const dl = document.getElementById('projList'); dl.innerHTML = projectList().map(p=>`<option value="${p}">`).join('');
  renderProjectChips();
  renderLabelChips();
  sheetWrap.classList.add('open');
}
document.getElementById('addBtn').onclick = ()=>openSheet(null);

document.getElementById('saveBtn').onclick = ()=>{
  const title = document.getElementById('f-title').value.trim();
  if(!title) return;
  const type = segVal('f-type');
  const later = document.getElementById('f-later').checked;
  const spans = document.getElementById('f-spans').checked;
  const typedLabels = document.getElementById('f-labels').value.split(',').map(s=>s.trim()).filter(Boolean);
  const labels = [...new Set([...selectedLabels, ...typedLabels])];
  const freq = segVal('f-recurFreq');
  const recur = {
    freq, interval: Math.max(1, parseInt(document.getElementById('f-interval').value)||1), mode: segVal('f-recurMode'),
    weekday: parseInt(segVal('f-weekday')), monthDay: Math.min(31, Math.max(1, parseInt(document.getElementById('f-monthday').value)||1))
  };

  let plannedVal = later ? null : (document.getElementById('f-planned').value || null);
  let endVal = (later || !spans) ? null : (document.getElementById('f-enddate').value || null);
  if(plannedVal && endVal && endVal < plannedVal){ const tmp=plannedVal; plannedVal=endVal; endVal=tmp; }

  const data = {
    title, type,
    project: type==='work' ? document.getElementById('f-project').value.trim() : null,
    priority: segVal('f-priority'),
    planned: plannedVal, endDate: endVal,
    due: document.getElementById('f-due').value || null,
    recur, labels,
    quick:false // saving through the full form always "graduates" a task out of quick-task status
  };

  let savedTask;
  if(editingId){
    const idx = tasks.findIndex(t=>t.id===editingId);
    if(idx>-1){ tasks[idx] = {...tasks[idx], ...data}; savedTask = tasks[idx]; }
  } else {
    savedTask = { id: uid(), done:false, completedAt:null, inProgress:false, ...data };
    tasks.push(savedTask);
  }
  if(savedTask){
    if(isUnscheduled(savedTask)) view='later';
    else if(isDueTodayOrRange(savedTask)) view='today';
    else view='all';
  }
  persist();
  sheetWrap.classList.remove('open');
  render();
};

initApp();
</script>
